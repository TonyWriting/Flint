; Flint configuration. Copy this file to flint.ini next to agent.ps1.
; If your team provides a setup folder, run agent.ps1 -Setup with it instead; it writes this file for you.
; Comments take whole lines and start with ; or #.

[model]
; Complete Foundry Responses API URL.
endpoint = https://<resource>.services.ai.azure.com/openai/v1/responses
deployment = <your-deployment>
; Reasoning effort: none, low, medium, high, xhigh or max. Higher levels think longer before answering.
reasoning_effort = medium
api_key = <your-key>
; Optional: where to get the key. Flint shows it when api_key is empty or the model rejects the key.
; api_key_help = <where to get the key>
